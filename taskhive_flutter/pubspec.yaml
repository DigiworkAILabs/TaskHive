name: taskhive_flutter
description: TaskHive Enterprise Task Management — Flutter App by Digiwork
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Navigation
  go_router: ^14.6.2

  # Models / Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Path (for PersistCookieJar on native — NOT used on web)
  path_provider: ^2.1.5

  # Firebase (Phase 4 — declared now)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # WebSocket STOMP (Phase 4 — declared now)
  stomp_dart_client: ^2.0.0

  # Charts (Phase 6 — declared now)
  fl_chart: ^0.70.2

  # Image / File (Phases 2-3 — declared now)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^8.1.7

  # Offline Caching
  # NOTE: hive_flutter already includes hive — do NOT add hive separately
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mockito: ^5.4.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/env/.env.dev
    - assets/env/.env.prod
