# ── SonarQube Project Configuration (NFR-MAIN-02) ────────────────────────────

sonar.projectKey=taskhive-backend
sonar.projectName=TaskHive Backend
sonar.projectVersion=1.0

# Source roots
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=21

# Compiled class output (run `mvn compile` first)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo coverage report generated by `mvn test`
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclude boilerplate — Lombok-generated, DTOs, models, config, exceptions, enums
sonar.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/model/**,\
  **/exception/**,\
  **/enums/**,\
  **/*Application.java

# Suppress "use constructor injection" rule — project uses @RequiredArgsConstructor everywhere
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S6813
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
