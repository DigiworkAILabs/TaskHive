# =============================================
# DATABASE
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/taskhive
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=20

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =============================================
# JWT
# =============================================
jwt.secret=TaskHiveDevSecretKey2026ForJWTTokenGenerationMustBeAtLeast256Bits!
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# =============================================
# COOKIE
# =============================================
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.domain=localhost

# =============================================
# DEFAULT ADMIN
# =============================================
app.admin.email=admin@taskhive.com
app.admin.password=Admin@123
app.admin.first-name=System
app.admin.last-name=Admin

# =============================================
# TOKEN EXPIRY
# =============================================
app.auth.activation-token-expiry=86400000
app.auth.reset-token-expiry=3600000

# =============================================
# ACCOUNT LOCKOUT
# =============================================
app.auth.max-failed-attempts=5
app.auth.lockout-duration=900000

# =============================================
# MAIL
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=erwin1410c@gmail.com
spring.mail.password=ezmmmitmxmklksjg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# FRONTEND URL
# =============================================
app.frontend.url=http://localhost:3000

# app.frontend.url=http://192.168.0.170:3000
# =============================================
# SERVER
# =============================================
server.port=8080

# =============================================
# LOGGING
# =============================================
logging.level.com.digiwork.taskhive=DEBUG
logging.level.org.springframework.security=DEBUG

# =============================================
# STORAGE
# =============================================
storage.type=local
storage.local.upload-dir=./uploads
storage.local.base-url=http://localhost:8080/uploads

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =============================================
# ACTUATOR & MONITORING (NFR-OPS-05, NFR-OPS-06)
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# =============================================
# ML SERVICE (Phase 7.1)
# =============================================
ml.enabled=true
ml.service.url=http://localhost:8000
ml.connect-timeout-ms=3000
ml.response-timeout-ms=5000

# =============================================
# RESILIENCE4J — ML Circuit Breaker
# =============================================
resilience4j.circuitbreaker.instances.mlService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mlService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mlService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mlService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mlService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mlService.automatic-transition-from-open-to-half-open-enabled=true

