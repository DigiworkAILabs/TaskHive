# =============================================
# ACTUATOR & MONITORING (NFR-OPS-05, NFR-OPS-06)
# =============================================
# Only expose health + prometheus in prod (no raw metric names)
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# =============================================
# ERROR HANDLING (NFR-USE-06)
# =============================================
# Prevent Spring Boot's /error fallback from leaking stack traces or exception details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
