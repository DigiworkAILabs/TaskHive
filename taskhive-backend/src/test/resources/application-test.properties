# =============================================
# DATABASE (Testcontainers will override these)
# =============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =============================================
# MAIL
# =============================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=password
management.health.mail.enabled=false

# =============================================
# JWT
# =============================================
jwt.secret=TaskHiveTestSecretKey2026ForJWTTokenGenerationMustBeAtLeast256Bits!
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=86400000

# =============================================
# COOKIE
# =============================================
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.domain=localhost

# =============================================
# FRONTEND URL
# =============================================
app.frontend.url=http://localhost:3000

# =============================================
# OTHER DEFAULTS
# =============================================
app.auth.activation-token-expiry=86400000
app.auth.reset-token-expiry=3600000
app.auth.max-failed-attempts=5
app.auth.lockout-duration=900000

# Admin Seeder
app.admin.email=admin@test.com
app.admin.password=Admin@123
app.admin.first-name=Admin
app.admin.last-name=User

# ML/Gemini
ml.enabled=false
ml.gemini.enabled=false
gemini.api.key=dummy
gemini.api.url=http://dummy
gemini.model=dummy
spring.task.scheduling.pool.size=0
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=2
